[project]
name = "pytest-agent-trace"
authors = [{ name = "Dawid Mularczyk" }]
version = "0.2.0"
description = "pytest for AI agents — trajectory-level recording, replay and assertions for LangGraph/LangChain agents"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Davsooonowy/pytest-agent-trace"
Repository = "https://github.com/Davsooonowy/pytest-agent-trace"
Issues = "https://github.com/Davsooonowy/pytest-agent-trace/issues"

[project.optional-dependencies]
langgraph = [
    "langchain-core>=1.0",
    "langgraph>=0.2",
]
fuzzy = [
    "sentence-transformers>=3.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5.0",
    # only needed to run examples/f1_agent.py and its test - not a supported
    # integration, just the model this repo's own demo happens to use
    "langchain-ollama>=1.0",
]

[project.entry-points.pytest11]
agent_trace = "agent_test.plugin"

[project.scripts]
agent-trace = "agent_test.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".idea",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
