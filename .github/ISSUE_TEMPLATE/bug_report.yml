name: Bug report
description: Something doesn't work the way the docs say it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A small agent + cassette (or a snippet) that shows the problem is worth
        far more than a description. Paste code/cassette content directly.
      render: python
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: pytest-agent-trace version
      description: Output of `pip show pytest-agent-trace`
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: true

  - type: input
    id: extras
    attributes:
      label: Extras installed
      description: e.g. `langgraph`, `fuzzy`
    validations:
      required: false
